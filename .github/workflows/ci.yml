name: Orders API CI

on: push: branches: - main pull_request: branches: - main

permissions: contents: read

jobs: test: name: Python Tests runs-on: ubuntu-latest

steps:
  - name: Checkout source code
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
      cache: pip

  - name: Install dependencies
    run: python -m pip install -r requirements.txt

  - name: Run tests
    run: python -m pytest -v
    env:
      PYTHONPATH: .


docker: name: Build, Scan, and Push Docker Image runs-on: ubuntu-latest needs: test if: github.event_name == 'push' && github.ref == 'refs/heads/main'

permissions:
  contents: read
  packages: write

steps:
  - name: Checkout source code
    uses: actions/checkout@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Define image name
    id: image
    shell: bash
    run: |
      echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  - name: Build Docker image
    uses: docker/build-push-action@v6
    with:
      context: .
      push: false
      tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
      load: true

  - name: Scan Docker image with Trivy
    uses: aquasecurity/trivy-action@0.29.0
    with:
      image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
      scan-type: image
      format: table
      exit-code: "1"
      ignore-unfixed: true
      vuln-type: os,library
      severity: CRITICAL,HIGH

  - name: Log in to GitHub Container Registry
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Build and push Docker image
    uses: docker/build-push-action@v6
    with:
      context: .
      push: true
      tags: |
        ${{ steps.image.outputs.name }}:${{ github.sha }}